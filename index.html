<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenue Planner — Gantu Holidays</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F2F4F7;color:#1A2535;font-size:14px}
.topbar{background:#0A1628;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #C9901A;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px}
.brand-box{width:36px;height:36px;background:#C9901A;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#0A1628;font-weight:700;flex-shrink:0}
.brand-name{font-size:15px;font-weight:600;color:#fff}
.brand-sub{font-size:11px;color:#A8C4D8;margin-top:1px}
.badge{background:rgba(200,144,26,.2);border:1px solid rgba(200,144,26,.4);border-radius:20px;padding:4px 14px;font-size:11px;color:#F5C842;font-weight:500}
.nav{background:#fff;border-bottom:1px solid #E2E8F0;display:flex;padding:0 24px;gap:0;position:sticky;top:61px;z-index:99;overflow-x:auto}
.ntab{padding:11px 16px;font-size:13px;font-weight:400;color:#64748B;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
.ntab:hover{color:#1A2535}
.ntab.active{color:#0A1628;font-weight:600;border-bottom-color:#0B7285}
.page{padding:20px 24px;display:none;max-width:1200px;margin:0 auto}
.page.active{display:block}
.krow{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.kcard{background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #E2E8F0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kcard.dk{background:#0A1628;border-color:#0A1628}
.kcard.gn{background:#EAF3DE;border-color:#C3E0A0}
.kcard.am{background:#FEF3E2;border-color:#F6D99A}
.kcard.pu{background:#EEEDFE;border-color:#C4C0FA}
.kcard.inf{background:#E6F1FB;border-color:#A8CEED}
.kcard.tl{background:#FFF8E6;border-color:#F6D99A}
.klbl{font-size:11px;color:#64748B;margin-bottom:4px;font-weight:500}
.kcard.dk .klbl{color:#A8C4D8}
.kcard.gn .klbl{color:#3B6D11}
.kcard.am .klbl{color:#7A5500}
.kcard.pu .klbl{color:#3C3489}
.kcard.inf .klbl{color:#185FA5}
.kcard.tl .klbl{color:#7A5500}
.kval{font-size:20px;font-weight:600;font-family:'Courier New',monospace;color:#1A2535}
.kcard.dk .kval{color:#fff}
.kcard.gn .kval{color:#27500A}
.kcard.am .kval{color:#5C3D00}
.kcard.pu .kval{color:#26215C}
.kcard.inf .kval{color:#0C447C}
.kcard.tl .kval{color:#5C3D00}
.ksub{font-size:11px;color:#94A3B8;margin-top:3px}
.kcard.dk .ksub{color:#6B9AB8}
.sec{font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:#64748B;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #E2E8F0}
.rcard{background:#fff;border:1px solid #E2E8F0;border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.rhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none}
.rhead:hover{background:#F8FAFC}
.rdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.rname{font-size:14px;font-weight:600;margin-left:10px}
.rmeta{font-size:12px;color:#64748B;margin-top:2px;margin-left:10px}
.rright{display:flex;align-items:center;gap:20px}
.rstat-val{font-size:13px;font-weight:600;font-family:'Courier New',monospace}
.rstat-lbl{font-size:10px;color:#94A3B8;margin-top:1px;text-align:right}
.rbody{border-top:1px solid #E2E8F0;padding:16px 18px;display:none}
.rbody.open{display:block}
.fbox{background:#F8FAFC;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#64748B;line-height:1.8;border:1px solid #E2E8F0}
.fbox strong{color:#1A2535}
.stbl{width:100%;border-collapse:collapse;font-size:12px}
.stbl th{text-align:left;padding:7px 10px;font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#64748B;border-bottom:1px solid #E2E8F0;background:#F8FAFC}
.stbl td{padding:8px 10px;border-bottom:1px solid #F1F5F9;font-family:'Courier New',monospace;font-size:12px}
.stbl .g{color:#0F6E56;font-weight:600}
.stbl .a{color:#854F0B;font-weight:600}
.stbl tfoot td{font-weight:600;border-top:2px solid #E2E8F0;background:#F8FAFC}
.add-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:2px dashed #CBD5E0;border-radius:12px;background:none;cursor:pointer;font-size:13px;color:#64748B;transition:all .15s;margin-bottom:18px}
.add-btn:hover{border-color:#0B7285;color:#0B7285;background:#F0F9FB}
.btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid #E2E8F0;background:#fff;color:#1A2535;transition:all .15s}
.btn:hover{background:#F8FAFC}
.btn.p{background:#0A1628;color:#fff;border-color:#0A1628}
.btn.p:hover{background:#0D2B55}
.btn.d{color:#A32D2D;border-color:#FECACA}
.btn.d:hover{background:#FEF2F2}
.haul-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;vertical-align:middle;margin-left:6px}
.haul-sh{background:#DBEAFE;color:#1D4ED8}
.haul-lh{background:#EDE9FE;color:#5B21B6}
.haul-do{background:#DCFCE7;color:#166534}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;z-index:999;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden}
.mhdr{padding:16px 20px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between;background:#F8FAFC}
.mtitle{font-size:15px;font-weight:600}
.mstep{font-size:12px;color:#64748B;background:#E2E8F0;padding:3px 11px;border-radius:20px}
.mbody{padding:20px}
.wbar{display:flex;gap:4px;margin-bottom:18px}
.ws{height:4px;flex:1;border-radius:2px;background:#E2E8F0}
.ws.d{background:#0B7285}
.ws.a{background:#7AC4CF}
.fq{font-size:16px;font-weight:600;margin-bottom:4px;color:#1A2535}
.fh{font-size:12px;color:#64748B;margin-bottom:14px;line-height:1.6}
.fld input{width:100%;padding:11px 14px;border:1.5px solid #E2E8F0;border-radius:9px;font-size:16px;font-family:'Courier New',monospace;color:#1A2535;background:#fff;outline:none;transition:border-color .15s}
.fld input:focus{border-color:#0B7285;box-shadow:0 0 0 3px rgba(11,114,133,.1)}
.haul-opts{display:flex;gap:10px;margin-top:4px}
.haul-opt{flex:1;padding:14px 8px;border:1.5px solid #E2E8F0;border-radius:9px;text-align:center;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;background:#F8FAFC}
.haul-opt:hover{border-color:#0B7285;background:#F0F9FB}
.haul-opt.sel{border-color:#0B7285;background:#E6F7FA;color:#0B7285;font-weight:600}
.calc-hint{font-size:12px;color:#0F6E56;margin-top:9px;padding:8px 12px;background:#F0FBF4;border-radius:8px;font-family:'Courier New',monospace;line-height:1.7;border:1px solid #BBE4C9}
.prev-box{background:#F8FAFC;border-radius:8px;padding:12px 14px;margin-top:12px;border:1px solid #E2E8F0}
.prev-ttl{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#94A3B8;margin-bottom:8px}
.prev-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:12px}
.prev-row .pl{color:#64748B}
.prev-row .pv{font-family:'Courier New',monospace;font-weight:600}
.mftr{padding:14px 20px;border-top:1px solid #E2E8F0;display:flex;justify-content:space-between;align-items:center;background:#F8FAFC}
/* TABLES */
.mtbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
.mtbl th{text-align:left;padding:7px 10px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#64748B;border-bottom:1px solid #E2E8F0;white-space:nowrap;background:#F8FAFC;position:sticky;top:0}
.mtbl td{padding:8px 10px;border-bottom:1px solid #F1F5F9;font-family:'Courier New',monospace;font-size:12px;white-space:nowrap}
.mtbl td.mn{font-family:-apple-system,sans-serif;font-weight:600;color:#1A2535}
.mtbl .tl{color:#1D4ED8;font-weight:600}
.mtbl .tc{color:#0F6E56;font-weight:600}
.mtbl .cum{color:#64748B}
.mtbl .eff{color:#854F0B}
.mtbl .arv{color:#5C3D00;font-weight:600}
.mtbl tr.ph-row{background:rgba(11,114,133,.05);outline:1px solid rgba(11,114,133,.25)}
.tbl-scroll{overflow-x:auto;border-radius:8px;border:1px solid #E2E8F0}
/* PHASE */
.pm-card{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.pm-circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.pm-title{font-size:15px;font-weight:600;margin-bottom:2px}
.pm-sub{font-size:12px;color:#64748B;margin-bottom:5px}
.pm-when{font-size:13px;font-weight:600;margin-bottom:3px}
.pm-detail{font-size:12px;color:#64748B;line-height:1.7}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-top:6px;margin-right:4px}
/* RAMP */
.ramp-info{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:#64748B;line-height:1.9}
.ramp-info strong{color:#1A2535}
/* CALC */
.calc-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:14px 18px;margin-bottom:12px}
.calc-card h3{font-size:13px;font-weight:600;margin-bottom:10px;color:#1A2535}
.calc-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px solid #F1F5F9;font-size:12px}
.calc-row:last-child{border-bottom:none}
.calc-row .cl{color:#64748B}
.calc-row .cv{font-family:'Courier New',monospace;font-weight:600;color:#1A2535}
.calc-row .cf{color:#94A3B8;font-size:11px;font-family:'Courier New',monospace}
.formula{background:#F8FAFC;border-radius:8px;padding:10px 14px;font-size:12px;font-family:'Courier New',monospace;color:#475569;margin:8px 0;line-height:1.8;border:1px solid #E2E8F0}
.formula strong{color:#1A2535}
/* ARPS */
.arps-tbl{width:100%;border-collapse:collapse;font-size:12px}
.arps-tbl th{text-align:left;padding:7px 10px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#64748B;border-bottom:1px solid #E2E8F0;white-space:nowrap;background:#F8FAFC}
.arps-tbl td{padding:8px 10px;border-bottom:1px solid #F1F5F9;font-family:'Courier New',monospace;font-size:12px;white-space:nowrap}
.arps-tbl .arv{color:#5C3D00;font-weight:600;background:#FFFBF0}
.arps-tbl tfoot td{background:#FFF8E6;font-weight:600;border-top:2px solid #F6D99A}
.chtw{position:relative;width:100%;height:240px;margin-top:12px}
.err{border-color:#E24B4A !important;box-shadow:0 0 0 3px rgba(226,75,74,.15) !important}
.empty{text-align:center;padding:48px 20px;color:#64748B}
.empty-icon{font-size:36px;margin-bottom:12px}
.empty-t{font-size:16px;font-weight:600;color:#1A2535;margin-bottom:6px}

/* ── MOBILE RESPONSIVE ─────────────────────────────────────────── */
@media (max-width: 640px){
  .topbar{padding:10px 14px;}
  .brand-name{font-size:13px;}
  .brand-sub{display:none;}
  .badge{display:none;}
  .nav{padding:0 6px;top:52px;}
  .ntab{padding:9px 8px;font-size:11px;}
  .page{padding:12px 12px;}
  .krow{grid-template-columns:repeat(2,1fr)!important;}
  .kval{font-size:16px!important;}
  .tbl-scroll{font-size:11px;}
  .mtbl th,.mtbl td{padding:5px 6px;font-size:10px;}
  #bot-panel{width:calc(100vw - 16px)!important;right:8px!important;bottom:76px!important;}
  .chtw{height:160px!important;}
  div[style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important;}
  div[style*="grid-template-columns:repeat(3,1fr)"]{grid-template-columns:1fr!important;}
  div[style*="grid-template-columns:repeat(auto-fit"]{grid-template-columns:repeat(2,1fr)!important;}
  .rhead{flex-wrap:wrap;gap:6px;}
  .rright{flex-wrap:wrap;gap:8px;}
}
@media (max-width: 400px){
  .krow{grid-template-columns:1fr 1fr!important;}
  .ntab{padding:8px 6px;font-size:10px;}
}
</style>

<script>
// Fix nav sticky offset dynamically based on topbar height
function fixNavOffset(){
  var tb = document.querySelector('.topbar');
  var nav = document.querySelector('.nav');
  if(tb && nav){
    nav.style.top = tb.offsetHeight + 'px';
  }
}
window.addEventListener('load', fixNavOffset);
window.addEventListener('resize', fixNavOffset);
</script>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-box">G</div>
    <div>
      <div class="brand-name">Revenue Planner — Gantu Holidays</div>
      <div class="brand-sub">Topline = Gross Booking Value &nbsp;·&nbsp; Bottomline = Net TAC &nbsp;·&nbsp; ARPS = Net TAC ÷ Sellers</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px"><div id="role-badge" class="badge">&#128274; Login</div><button id="logout-btn" onclick="doLogout()" style="display:none;padding:4px 12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#A8C4D8;font-size:11px;cursor:pointer;font-family:-apple-system,sans-serif">Logout</button></div>
</div>

<div class="nav" id="nav">
  <button class="ntab active" onclick="goTab('overview',this)">Overview</button>
  <button class="ntab" onclick="goTab('regions',this)">Regions</button>
  <button class="ntab" onclick="goTab('monthly',this)">Monthly Aimed Plan</button>
  <button class="ntab" onclick="goTab('arps',this)">ARPS</button>
  <button class="ntab" onclick="goTab('phases',this)">Phase Targets</button>
  <button class="ntab" onclick="goTab('pnl',this)">P&amp;L</button>
  <button class="ntab" onclick="goTab('hierarchy',this)">Team Hierarchy</button>
  <button class="ntab" onclick="goTab('hiring',this)">Monthly Goals</button>
  <button class="ntab" onclick="goTab('analytics',this)">Analytics</button>
  <button class="ntab" onclick="goTab('market',this)">Market Intel</button>
  <button class="ntab" onclick="goTab('ramp',this)">Ramp Model</button>
  <button class="ntab" onclick="goTab('calc',this)">Calculations</button>
  <div style="flex:1"></div>
  <button onclick="resetToDefaults()" style="padding:6px 12px;font-size:11px;color:#94A3B8;background:none;border:none;cursor:pointer;white-space:nowrap;font-family:-apple-system,sans-serif" title="Reset to default plan">↺ Reset</button>
  <div id="save-indicator" style="display:none;align-items:center;gap:5px;padding:0 12px;font-size:11px;color:#166534;white-space:nowrap">

  </div>
</div>

<div id="pg-overview"   class="page active"></div>
<div id="pg-regions"    class="page"></div>
<div id="pg-monthly"    class="page"></div>
<div id="pg-arps"       class="page"></div>
<div id="pg-phases"     class="page"></div>

<script>
// ─── DATA ────────────────────────────────────────────────────────
var regions = [
  {name:'Nordic',    haul:'Long-Haul',  sellers:10, workdays:26, leads:8,  conv:3, ticket:250000, tac:35000, notes:'Norway, Sweden, Iceland, Denmark — premium coolcation & Northern Lights packages'},
  {name:'Europe',    haul:'Long-Haul',  sellers:15, workdays:26, leads:8,  conv:3, ticket:250000, tac:35000, notes:'Multi-country Western Europe — France, Italy, Switzerland, Spain'},
  {name:'Bali',      haul:'Short-Haul', sellers:10, workdays:26, leads:6,  conv:5, ticket:100000, tac:20000, notes:'Destination weddings, wellness, honeymoon. India is #2 source market.'},
  {name:'Singapore', haul:'Short-Haul', sellers:10, workdays:26, leads:10, conv:4, ticket:100000, tac:20000, notes:'Family & luxury. 1.2M+ Indians visited in 2025. Visa-friendly.'},
  {name:'Kenya',     haul:'Long-Haul',  sellers:10, workdays:26, leads:8,  conv:3, ticket:250000, tac:35000, notes:'Safari & wildlife — Maasai Mara, Amboseli. Ultra-premium segment. Growing Indian outbound.'}
];

// ─── P&L CONFIG ───────────────────────────────────────────────────
// Store defaults before any localStorage override
var DEFAULT_REGIONS = regions.map(r=>Object.assign({},r));
// Load saved regions if they exist
loadRegions();

// ─── ROLE-BASED ACCESS SYSTEM ────────────────────────────────────
// Roles: 'cro' | 'manager' | 'seller' | null (not logged in)
var ROLES = {
  cro:     { pin:'8642', label:'Amit Kilania',    color:'#C9901A' },
  manager: { pin:'5566', label:'Manager View',    color:'#0B7285' },
  seller:  { pin:null,   label:'Seller View',     color:'#534AB7' }
};

// Tab visibility per role
var TAB_ACCESS = {
  cro:     ['overview','regions','monthly','arps','phases','pnl','hierarchy','hiring','analytics','market','ramp','calc'],
  manager: ['hierarchy','hiring','analytics','market'],
  seller:  ['hiring']
};

var currentRole = null;   // 'cro' | 'manager' | 'seller'
var currentUser = null;   // null | manager name | seller {region,idx}

function initLogin() {
  var ov = document.createElement('div');
  ov.id = 'login-screen';
  ov.style.cssText = 'position:fixed;inset:0;background:#0A1628;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column';
  ov.innerHTML =
    '<div style="text-align:center;margin-bottom:32px">'
    +'<div style="width:56px;height:56px;background:#C9901A;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#0A1628;margin:0 auto 12px">G</div>'
    +'<div style="font-size:20px;font-weight:700;color:#fff;margin-bottom:4px">Gantu Holidays</div>'
    +'<div style="font-size:13px;color:#A8C4D8">Revenue Planner &middot; Select your role to continue</div>'
    +'</div>'
    +'<div style="display:flex;flex-direction:column;gap:12px;width:320px">'
    +'<button data-login="cro"     style="padding:14px 20px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:-apple-system,sans-serif;background:#C9901A;color:#0A1628">&#128081; Amit Kilania</button>'
    +'<button data-login="manager" style="padding:14px 20px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:-apple-system,sans-serif;background:#0B7285;color:#fff">&#128203; Manager View</button>'
    +'<button data-login="seller"  style="padding:14px 20px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:-apple-system,sans-serif;background:#534AB7;color:#fff">&#128100; Seller View</button>'
    +'</div>'
    +'<style>.lbtn:hover{opacity:.85}</style>';
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e){
    var btn = e.target.closest('[data-login]');
    if(btn) loginAs(btn.dataset.login);
  });
}

function loginAs(role) {
  if(role === 'seller') { showSellerPicker(); return; }
  // PIN modal
  var ov2 = document.createElement('div');
  ov2.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100000;display:flex;align-items:center;justify-content:center';
  var roleLabel = role==='cro' ? 'Amit Kilania' : 'Manager';
  ov2.innerHTML =
    '<div style="background:#fff;border-radius:14px;padding:28px 32px;width:300px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.4)">'
    +'<div style="font-size:28px;margin-bottom:6px">&#128274;</div>'

// ─── RAMP ────────────────────────────────────────────────────────
function sellerProd(m){ return m<=0?0: m===1?.50: m===2?.75: 1.0; }

// ─── AGE-BASED CHURN MODEL (based on CRO's actual experience) ────
//
// Churn is NOT flat 30%/month. It is front-loaded:
//   Month 0–1 (training):      15% chance of dropping out
//   Month 2–3 (early floor):    8% chance of leaving (finding it hard, low earnings)
//   Month 4+ (earning):         2% chance — once converting, people stay
//
// This reflects the reality: most exits happen in Month 1–2 before productivity.
// Survivors past Month 3 are retained assets — ~2% monthly attrition after that.
//
// Hiring: 2–3 sellers join per month until target headcount reached.
// Replacements: hired for anyone who exits, with 1-month gap.
// Headcount always maintained at ts (target sellers).

var CHURN_BY_AGE = [0.15, 0.15, 0.08, 0.08, 0.02]; // index = months active (4+ = 0.02)
function getChurn(mActive){
  if(mActive < CHURN_BY_AGE.length) return CHURN_BY_AGE[mActive];
  return 0.02;
}

function computeCap(ts, mo){
  ts = Math.max(1, ts);
  var BATCH = Math.max(3, Math.ceil(ts / 6)); // scales: 10-seller team hires 2-3/mo, 17-seller team hires 3/mo

  // Simulate forward month by month up to 'mo'
  // team = array of {count, joinedAt} cohorts active right now
  // Each month: apply age-based churn, add replacements from last month's exits

  var cohorts = []; // {joinedAt: month, count: number}
  var pendingReplacement = 0; // people who left last month, joining this month

  for(var m = 0; m <= mo; m++){
    // 1. New hires this month
    var currentHeadcount = cohorts.reduce((a,c)=>a+c.count, 0);
    var newHires = 0;

    // During build-up: hire 2-3/month until target reached
    if(currentHeadcount < ts){
      newHires = Math.min(BATCH, ts - currentHeadcount);
    }

    // Replacements from previous month's exits (after 1-month gap)
    newHires += pendingReplacement;

    // Cap: don't exceed target headcount
    var headcountAfterReplacement = currentHeadcount + newHires;
    if(headcountAfterReplacement > ts){
      newHires = Math.max(0, ts - currentHeadcount);
    }

    if(newHires > 0){
      cohorts.push({ joinedAt: m, count: newHires });
    }

    // 2. Apply age-based churn — who leaves this month?
    var exitsThisMonth = 0;
    cohorts = cohorts.map(function(c){
      var age = m - c.joinedAt; // how many months since they joined
      var churnRate = getChurn(age);
      var exits = c.count * churnRate;
      exitsThisMonth += exits;
      return { joinedAt: c.joinedAt, count: c.count - exits };
    }).filter(function(c){ return c.count > 0.01; });

    // 3. These exits will be replaced next month (after 1-month gap)
    pendingReplacement = Math.round(exitsThisMonth);
  }

  // Calculate effective output at month 'mo'
  var totalEff = 0;
  var totalHeadcount = 0;
  cohorts.forEach(function(c){
    var age = mo - c.joinedAt;
    totalEff += c.count * sellerProd(age);
    totalHeadcount += c.count;
  });

  var eff = Math.min(ts, Math.max(0, totalEff));
  return {
    effFactor: eff / ts,
    effectiveSellers: Math.round(eff * 10) / 10,
    actualHeadcount: Math.round(totalHeadcount * 10) / 10
  };
}

// ─── CALC ────────────────────────────────────────────────────────
function calcFull(r){
  var l=Math.round((+r.leads)*(+r.sellers)*(+r.workdays));
  var p=Math.round(l*(+r.conv)/100);
  var tl=p*(+r.ticket), tac=p*(+r.tac);
  return {leads:l, pnrs:p, topline:tl, tac:tac,
    margin: tl>0?Math.round(tac/tl*1000)/10:0,
    arps:   r.sellers>0?Math.round(tac/r.sellers):0};
}
function calcMonth(r, mo){
  var cap = computeCap(+r.sellers, mo);
  var l=Math.round((+r.leads)*cap.effectiveSellers*(+r.workdays));
  var p=Math.round(l*(+r.conv)/100);
  var tl=p*(+r.ticket), tac=p*(+r.tac);
  return {leads:l, pnrs:p, topline:tl, tac:tac,
    effFactor:cap.effFactor, effectiveSellers:cap.effectiveSellers,
    arps: cap.effectiveSellers>0 ? Math.round(tac/cap.effectiveSellers) : 0};
}

// ─── PHASE CROSSINGS — monthly run rate ──────────────────────────
// Phase target = monthly Net TAC run rate (not cumulative)
// We find the first month where monthly TAC >= phase target
function getPhaseCrossings(){
  var cross = {};
  for(var mo = 0; mo < 36; mo++){
    var moTAC = regions.reduce((a,r)=>a+calcMonth(r,mo).tac, 0);
    PHASES.forEach((ph,pi)=>{
      if(cross[pi]===undefined && moTAC >= ph.target){
        cross[pi] = { month: mo, monthlyTAC: moTAC };
      }
    });
  }
  return cross;
}

// ─── PHASES ──────────────────────────────────────────────────────
function renderPhases(){
  var el=document.getElementById('pg-phases');
  if(!regions.length){ el.innerHTML=emptyState('🎯','No regions yet'); return; }
  var monthlyTAC=[], monthlyTL=[];
  var cross=getPhaseCrossings();
  for(var mo=0;mo<36;mo++){
    monthlyTAC.push(regions.reduce((a,r)=>a+calcMonth(r,mo).tac,0));
    monthlyTL.push(regions.reduce((a,r)=>a+calcMonth(r,mo).topline,0));
  }
  var fullTAC = regions.reduce((a,r)=>a+calcFull(r).tac, 0);
  var fullTL  = regions.reduce((a,r)=>a+calcFull(r).topline, 0);
  var totalSellers = regions.reduce((a,r)=>a+(+r.sellers), 0);
  var html='<div class="ramp-info">'+
    '<strong>Phase targets = monthly Net TAC run rate (bottomline per month).</strong><br>'+
    'Phase 1 = ₹50L/mo by <strong>Month 6</strong> &nbsp;·&nbsp; Phase 2 = ₹75L/mo by <strong>Month 8–10</strong> &nbsp;·&nbsp; Phase 3 = ₹1Cr/mo by <strong>Month 12–15</strong><br>'+
    'Plan: <strong>'+totalSellers+' sellers</strong> across <strong>'+regions.length+' regions</strong> &nbsp;·&nbsp; Full cap TAC: <strong>'+fmt(fullTAC)+'/mo</strong> &nbsp;·&nbsp; Full cap Topline: <strong>'+fmt(fullTL)+'/mo</strong>'+
  '</div>';

    var c=cross[pi], reached=!!c, mn=reached?c.month+1:null;
    var pctOfTarget = reached ? 100 : Math.round(monthlyTAC[Math.min(35,11)] / ph.target * 100);
    var tags='';
    if(reached){
      tags+='<span class="tag" style="background:'+ph.tagBg+';color:'+ph.color+'">Month '+mn+' — '+getML(c.month)+'</span>';
      if(pi===0 && mn<=6)  tags+='<span class="tag" style="background:#DCFCE7;color:#166534">✅ Within Phase 1 window (Mo 1–6)</span>';
      else if(pi===0 && mn>6) tags+='<span class="tag" style="background:#FEE2E2;color:#991B1B">⚠ Late — Phase 1 target was Month 6</span>';
      else if(pi===1 && mn>=8 && mn<=10) tags+='<span class="tag" style="background:#DCFCE7;color:#166534">✅ Within Phase 2 window (Mo 8–10)</span>';
      else if(pi===1 && mn<8)  tags+='<span class="tag" style="background:#DCFCE7;color:#166534">✅ Ahead of Phase 2 window</span>';
      else if(pi===1 && mn>10) tags+='<span class="tag" style="background:#FEE2E2;color:#991B1B">⚠ Late — Phase 2 target was Month 8–10</span>';
      else if(pi===2 && mn>=12 && mn<=15) tags+='<span class="tag" style="background:#DCFCE7;color:#166534">✅ Within Phase 3 window (Mo 12–15)</span>';
      else if(pi===2 && mn<12) tags+='<span class="tag" style="background:#DCFCE7;color:#166534">✅ Ahead of Phase 3 window</span>';
      else if(pi===2 && mn>15) tags+='<span class="tag" style="background:#FEE2E2;color:#991B1B">⚠ Late — Phase 3 target was Month 12–15</span>';
    } else {
      tags+='<span class="tag" style="background:#FEE2E2;color:#991B1B">Not reachable — add sellers / regions</span>';
      tags+='<span class="tag" style="background:#F1F5F9;color:#475569">Full cap TAC: '+fmt(fullTAC)+'/mo vs target: '+fmt(ph.target)+'/mo</span>';
    }
    html+='<div class="pm-card">'+
      '<div class="pm-circle" style="background:'+ph.color+'">P'+(pi+1)+'</div>'+
      '<div style="flex:1">'+
        '<div class="pm-title">'+ph.name+' — '+ph.label+'</div>'+
        '<div class="pm-sub">Target: '+fmt(ph.target)+' net TAC per month (monthly run rate)</div>'+
        '<div class="pm-when" style="color:'+(reached?ph.color:'#DC2626')+'">'+
          (reached
            ? 'First hit in '+getML(c.month)+' (Month '+mn+' from May 2026) — monthly TAC that month: '+fmt(c.monthlyTAC)
            : 'Your full capacity ('+fmt(fullTAC)+'/mo) does not reach this target — add more sellers or regions')+
        '</div>'+
        '<div class="pm-detail" style="margin-top:4px">'+
          (reached
            ? 'From '+getML(c.month)+' onwards your plan consistently generates ₹'+fmt(ph.target)+'+ per month. '+
              'Topline that month: '+fmt(monthlyTL[c.month])
            : 'Gap: you need '+fmt(ph.target - fullTAC)+' more in monthly TAC. '+

function renderPnL(){
  var el=document.getElementById('pg-pnl');
  var C=PNL_CFG;
  var totalSellers=regions.reduce((a,r)=>a+(+r.sellers),0);  // 57
  var totalManagers=regions.length;                            // 5
  var totalSFUsers=totalSellers+totalManagers+1;              // +1 CRO

  // Fixed monthly costs (don't change with revenue)
  var fixedSellerSalary=totalSellers*C.sellerFixedSalary;
  var fixedManagerSalary=totalManagers*C.managerSalary;
  var fixedCRO=C.croSalary;
  var fixedOps=C.opsHeadSalary;
  var fixedSalesforce=totalSFUsers*C.salesforcePerUser;
  var fixedTotal=fixedSellerSalary+fixedManagerSalary+fixedCRO+fixedOps+fixedSalesforce;

  // Build 12-month P&L
  var months=[];
  for(var m=0;m<12;m++){
    var moTAC=regions.reduce((a,r)=>a+calcMonth(r,m).tac,0);
    var moTL=regions.reduce((a,r)=>a+calcMonth(r,m).topline,0);
    var moLeads=regions.reduce((a,r)=>a+calcMonth(r,m).leads,0);
    var moEffSel=regions.reduce((a,r)=>a+calcMonth(r,m).effectiveSellers,0);

    // Variable costs
    var varBonus=moTAC*C.sellerBonusPct;          // 5% of TAC
    var varLeads=moLeads*C.leadCostPerLead;         // ₹150/lead
    var varMisc=moTAC*C.miscPct;                   // 3% of TAC
    var varTotal=varBonus+varLeads+varMisc;

    // Seed investment only Month 1
    var seedCost=m===0?C.seedInvestment:0;

    var totalCost=fixedTotal+varTotal+seedCost;
    var netProfit=moTAC-totalCost;
    var margin=moTAC>0?Math.round(netProfit/moTAC*100):0;

    months.push({
      m:m, moTAC, moTL, moLeads, moEffSel,
      fixedSellerSalary, fixedManagerSalary, fixedCRO, fixedOps, fixedSalesforce,
      fixedTotal, varBonus, varLeads, varMisc, varTotal,

// ── DOJ ramp ─────────────────────────────────────────────────────
function getRampFactor(doj,dashIdx){
  if(!doj)return null;
  var p=doj.split('-'),dY=parseInt(p[0]),dM=parseInt(p[1])-1;
  var base=2026*12+4, dash=base+dashIdx, doj_abs=dY*12+dM;
  var diff=dash-doj_abs;
  if(diff<=0)return 0; if(diff===1)return 0.5; if(diff===2)return 0.75; return 1.0;
}

// ── Seller target calculation ─────────────────────────────────────
var selectedMonth=0;
var selectedSeller=null;
var MONTHS_LABELS=['May 2026','Jun 2026','Jul 2026','Aug 2026','Sep 2026','Oct 2026','Nov 2026','Dec 2026','Jan 2027','Feb 2027','Mar 2027','Apr 2027'];

function getSellerTarget(region,si,mo){
  var r=regions.find(function(x){return x.name===region;}); if(!r)return null;
  var sd=getSeller(region,si);
  var rf;
  if(sd&&sd.doj){rf=getRampFactor(sd.doj,mo);}
  else{var jm=Math.floor(si/3),mof=mo-jm;rf=mof<=0?0:mof===1?.5:mof===2?.75:1;}
  var fl=r.leads*r.workdays,fp=Math.round(fl*r.conv/100),ft=fp*r.tac;
  var tl=Math.round(fl*rf),tp=Math.round(fp*rf),tt=Math.round(ft*rf),comm=Math.round(tt*.05);
  return {region:region,si:si,mo:mo,rf:rf,
    tl:tl,tp:tp,tt:tt,comm:comm,sal:22500,earn:22500+comm,
    midPNR:Math.ceil(tp/2),dLeads:(r.leads*rf).toFixed(1),dPNR:(tp/r.workdays).toFixed(2),
    wd:r.workdays,conv:r.conv,ticket:r.ticket,tac:r.tac,
    notJoined:rf===0,sd:sd};
}

function motivMsg(t){
  if(!t||t.notJoined)return{msg:'Joining soon — prepare your product knowledge and pitch.',col:'#94A3B8'};
  if(t.rf===0)return{msg:'In training. Absorb everything — your pipeline starts now.',col:'#94A3B8'};
  if(t.rf<1)return{msg:'Ramp period ('+Math.round(t.rf*100)+'% target). Build pipeline today — Month 3 results depend on leads you generate now.',col:'#854F0B'};
  return{msg:'Full target. '+t.tp+' PNRs needed — '+t.dPNR+' bookings per working day. Stay disciplined.',col:'#0B7285'};
}

      +'</div></div>';
    document.body.appendChild(ov);
    ov.querySelector('#mc').onclick=function(){ov.remove();};
    ov.querySelector('#mcc').onclick=function(){ov.remove();};
    var rm=ov.querySelector('#mrm');
    if(rm)rm.onclick=function(){
      if(confirm('Remove '+getSellerName(region,idx)+'?')){
        delete sellerRegistry[sellerKey(region,idx)];
        saveSellerRegistry();ov.remove();renderHierarchy();showSaveToast();
      }
    };
    ov.querySelector('#msv').onclick=function(){
      var nm=ov.querySelector('#mn').value.trim();
      if(!nm){ov.querySelector('#mn').style.borderColor='#DC2626';return;}
      sellerRegistry[sellerKey(region,idx)]={
        name:nm,region:ov.querySelector('#mr').value,
        doj:ov.querySelector('#md').value,designation:ov.querySelector('#mdg').value
      };
      saveSellerRegistry();ov.remove();renderHierarchy();showSaveToast();
    };
    setTimeout(function(){var i=ov.querySelector('#mn');if(i){i.focus();if(i.value)i.select();}},50);
  });
}

  h+='<div style="display:flex;justify-content:center;margin-bottom:0"><div style="width:55%;display:flex;justify-content:space-between">';
  h+='<div style="width:2px;height:18px;background:#CBD5E0"></div>';
  h+='<div style="width:2px;height:18px;background:#CBD5E0"></div>';
  h+='</div></div>';

  // ── ROW 2: Sayandeep + Gaurav ───────────────────────
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:0">';
  h+=orgRowCard('Sayandeep','Sr. Category Manager','SD','#0B7285','#E6F7FA','#0A1628',
    [{l:'Plan team',v:(bS+sgS+kS)+' sellers (Bali·Singapore·Kenya)'},{l:'+ Existing',v:lS+' (Ladakh & Spiti via Suraj)'},{l:'TAC',v:fmt(sTAC)+'/mo'}],
    'Owns 3 plan regions + existing Mohali team through Suraj');
  h+=orgRowCard('Gaurav Malani','Sales Manager · Acting TL','GM','#534AB7','#EEEDFE','#0A1628',

  h+='<div></div></div>';

  // ── ROW 3: Suraj (under Sayandeep) ─────────────────
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">';
  h+=orgRowCard('Suraj','Team Leader','SU','#166534','#F0FBF4','#0A1628',

  // ── MONTH SELECTOR ────────────────────────────────
  h+='<div class="sec">Seller monthly goals — click a month</div>';

  for(var mi=0;mi<MONTHS_LABELS.length;mi++){
    h+='<button class="msb" data-m="'+mi+'" style="padding:6px 13px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid '+(mi===selectedMonth?'#0B7285':'#E2E8F0')+';background:'+(mi===selectedMonth?'#0B7285':'#fff')+';color:'+(mi===selectedMonth?'#fff':'#64748B')+';font-family:-apple-system,sans-serif;transition:all .15s">'+MONTHS_LABELS[mi]+'</button>';

  el.onclick = function(e){

      var key=mt.dataset.key;
      var body=document.getElementById(key);
      var chev=document.getElementById('chev-'+key);
      if(body){
        var isOpen=body.style.display!=='none'&&body.style.display!=='';
        body.style.display=isOpen?'none':'grid';
        if(chev) chev.style.transform=isOpen?'':'rotate(180deg)';
      }
      return;
    }
    // Month button
    var msb=e.target.closest('.msb');
    if(msb){
      selectedMonth=parseInt(msb.dataset.m);
      el.querySelectorAll('.msb').forEach(function(b){
        var active=parseInt(b.dataset.m)===selectedMonth;
        b.style.background=active?'#0B7285':'#fff';
        b.style.color=active?'#fff':'#64748B';
        b.style.borderColor=active?'#0B7285':'#E2E8F0';
      });
      document.getElementById('seller-goals-grid').innerHTML=buildSellerCards();
      var lbEl=el.querySelector('#lb-table');
      if(lbEl) lbEl.outerHTML=buildLeaderboard();
      if(selectedSeller) showSellerDetail(selectedSeller.rn,selectedSeller.si);
      return;
    }
    // Edit button
    var eb=e.target.closest('.sc-edit');
    if(eb){ e.stopPropagation(); openAddSellerModal(eb.dataset.r,parseInt(eb.dataset.i)); return; }
    // Seller card
    var sc=e.target.closest('.sc-card');
    if(sc){ showSellerDetail(sc.dataset.r,parseInt(sc.dataset.i)); return; }
    // Leaderboard row
    var lr=e.target.closest('.lb-row');
    if(lr){ showSellerDetail(lr.dataset.r,parseInt(lr.dataset.i)); return; }
    // Close seller detail
    if(e.target.id==='sd-close'){ selectedSeller=null; document.getElementById('seller-detail').innerHTML=''; }
    // Edit from detail panel
    if(e.target.id==='sd-edit' && selectedSeller){ openAddSellerModal(selectedSeller.rn,selectedSeller.si); }
    // Timeline month click
    var tc=e.target.closest('.tl-mo');
    if(tc){ selectedMonth=parseInt(tc.dataset.m); if(selectedSeller) showSellerDetail(selectedSeller.rn,selectedSeller.si); }
  };
}

// keep miniStat and detailStat as aliases for compatibility
function miniStat(label,val,unit,col,tip){ return sStat(label,val,col); }
function detailStat(label,val,unit,col,bg,tip){ return dStat(label,val,unit,col,bg); }

function buildLeaderboard(){
  var all=[];
  regions.forEach(function(r){
    for(var si=0;si<r.sellers;si++){
      var t=getSellerTarget(r.name,si,selectedMonth);
      all.push({r:r.name,si:si,tt:t.tt,tp:t.tp,comm:t.comm,rf:t.rf,nj:t.notJoined});
    }
  });
  all.sort(function(a,b){return b.tt-a.tt;});
  var h='<div id="lb-table"><table class="mtbl" style="margin-bottom:0"><thead><tr>'
    +'<th>#</th><th>Seller</th><th>Region</th><th>Designation</th><th>TAC target</th><th>PNRs</th>'
    +(currentRole==='cro'?'<th>Commission</th>':'')
    +'<th>Ramp</th>'
    +'</tr></thead><tbody>';
  all.forEach(function(s,idx){
    var med=idx===0?'&#127945;':idx===1?'&#129352;':idx===2?'&#129353;':'';
    var sd=getSeller(s.r,s.si);
    h+='<tr class="lb-row" data-r="'+s.r+'" data-i="'+s.si+'" style="cursor:pointer" onmouseover="this.style.background=\'#F8FAFC\'" onmouseout="this.style.background=\'\'">';
    h+='<td style="font-weight:700;color:#C9901A">'+med+(idx+1)+'</td>';
    h+='<td style="font-weight:600;font-family:-apple-system,sans-serif">'+getSellerName(s.r,s.si)+'</td>';
    h+='<td style="font-size:11px">'+s.r+'</td>';
    h+='<td style="font-size:11px;color:#64748B">'+(sd&&sd.designation?sd.designation.split(' ').slice(0,4).join(' '):'Sales & BD Exec')+'</td>';
    h+='<td style="color:#0F6E56;font-weight:600">'+fmt(s.tt)+'</td>';
    h+='<td>'+s.tp+'</td>';
    h+=(currentRole==='cro'?'<td style="color:#854F0B">&#8377;'+fmtN(s.comm)+'</td>':'');
    h+='<td><span style="font-size:10px;padding:2px 7px;border-radius:20px;background:'+(s.rf===1?'#DCFCE7':s.rf>0?'#FEF9C3':'#F1F5F9')+';color:'+(s.rf===1?'#166634':s.rf>0?'#78350F':'#94A3B8')+'">'+(s.nj?'Not joined':s.rf===1?'100%':Math.round(s.rf*100)+'%')+'</span></td>';
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div style="font-size:11px;color:#94A3B8;margin-top:6px">Click any row to view seller detail card. Updates when you switch month above.</div>';
  return h;
}

var goalsView = 'manager'; // 'manager' | 'region'

function renderHiring(){
  var el = document.getElementById('pg-hiring');
  if(!el) return;

  // If seller role — show only personal goal
  if(currentRole === 'seller' && currentUser && typeof currentUser === 'object') {
    renderSellerPersonalGoal(el);
    return;
  }

  var MO = MONTHS_LABELS;
  var MGRS = {Nordic:'Gaurav Malani',Europe:'Gaurav Malani',Bali:'Sayandeep',Singapore:'Sayandeep',Kenya:'Sayandeep'};

  // Build hiring schedule
  var allHires = [];
  regions.forEach(function(r){
    var hired=0, mo=0;
    while(hired<r.sellers && mo<12){
      var batch=Math.min(3,r.sellers-hired);
      for(var b=0;b<batch;b++){
        allHires.push({region:r.name,manager:MGRS[r.name]||'TBD',slot:hired+b+1,joinMonth:mo,haul:r.haul,leads:r.leads,conv:r.conv,ticket:r.ticket,tac:r.tac,sellers:r.sellers});
      }
      hired+=batch; mo++;
    }
  });

  var totalSellers = regions.reduce(function(a,r){return a+r.sellers;},0);
  var filledSlots = allHires.filter(function(h){return !!getSeller(h.region,h.slot-1);}).length;

  var h = '';

  // Header
  h += '<div style="background:#0A1628;border-radius:12px;padding:16px 20px;margin-bottom:20px">';

  h += '<div style="font-size:12px;color:#A8C4D8;margin-top:2px">'+totalSellers+' seller positions across 5 regions · May 2026 onwards</div></div>';

  h += '<button data-view="region" id="view-rgn-btn" style="padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid '+(goalsView==='region'?'#F5C842':'rgba(255,255,255,.2)')+';background:'+(goalsView==='region'?'#F5C842':'transparent')+';color:'+(goalsView==='region'?'#0A1628':'#A8C4D8')+';font-family:-apple-system,sans-serif">Region view</button>';
  h += '</div></div>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">';
  h += hPlanKCard('Total positions', totalSellers+' sellers', '#C9901A');
  h += hPlanKCard('Filled / named', filledSlots+' slots', '#0F6E56');
  h += hPlanKCard('Vacant', vacantSlots+' to hire', '#F59E0B');
  h += hPlanKCard('Managers', '2 (+ Suraj TL)', '#0B7285');
  h += '</div></div>';

  // ── MANAGER SUMMARY TABLE (CRO view) ─────────────────────────────
  if(currentRole === 'cro') {
    h += '<div class="sec">Manager goal summary — click to drill down</div>';
    h += '<div style="background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;margin-bottom:18px">';
    h += '<table class="mtbl" style="margin-bottom:0"><thead><tr>';
    h += '<th>Manager</th><th>Role</th><th>Regions</th><th>Sellers</th>';
    for(var mi=0;mi<Math.min(6,MO.length);mi++) h += '<th style="white-space:nowrap">'+MO[mi].split(' ')[0]+'</th>';
    h += '<th>Full cap TAC</th></tr></thead><tbody>';

    var managerDefs = [
      {name:'Gaurav Malani', role:'Sales Manager · Acting TL', regions:['Nordic','Europe'], color:'#534AB7'},
      {name:'Sayandeep',     role:'Sr. Category Manager',      regions:['Bali','Singapore','Kenya'], color:'#0B7285'}
    ];
    managerDefs.forEach(function(mgr){
      var mgrSellers = mgr.regions.reduce(function(a,rn){var r=regions.find(function(x){return x.name===rn;});return a+(r?r.sellers:0);},0);
      var fcTAC = mgr.regions.reduce(function(a,rn){var r=regions.find(function(x){return x.name===rn;});return a+(r?Math.round(r.sellers*r.leads*r.workdays*r.conv/100)*r.tac:0);},0);
      h += '<tr class="mgr-row" data-mgr="'+mgr.name+'" style="cursor:pointer" onmouseover="this.style.background=\'#F8FAFC\'" onmouseout="this.style.background=\'\'">'; 
      h += '<td><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:50%;background:'+mgr.color+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff">'+mgr.name.charAt(0)+'</div><span style="font-weight:600">'+mgr.name+'</span></div></td>';
      h += '<td style="font-size:11px;color:#64748B">'+mgr.role+'</td>';
      h += '<td style="font-size:11px">'+mgr.regions.join(', ')+'</td>';
      h += '<td style="font-weight:600">'+mgrSellers+'</td>';

      }
      h += '<td style="color:#0F6E56;font-weight:600">'+fmt(fcTAC)+'/mo</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    h += '<div id="mgr-drilldown"></div>';
  }

  // ── MAIN GOALS VIEW (manager or region) ──────────────────────────
  h += '<div class="sec" style="margin-top:4px" id="goals-section-title">'+(goalsView==='manager'?'Manager-wise hiring & goals':'Region-wise hiring & goals')+'</div>';
  h += '<div id="goals-body">' + buildGoalsBody(allHires, goalsView) + '</div>';

  el.innerHTML = h;

  // Attach event for drilldown close
  el.onclick = function(e){
    // View toggle buttons
    var vb = e.target.closest('[data-view]');
    if(vb){ setGoalsView(vb.dataset.view); return; }
    // Close drilldown
    if(e.target.id === 'close-drilldown'){
      document.getElementById('mgr-drilldown').innerHTML = '';
      return;
    }
    // Manager row click → drilldown
    var mgrRow = e.target.closest('.mgr-row');
    if(mgrRow){ showManagerDrillDown(mgrRow.dataset.mgr); return; }
    // Edit seller button
    var eb = e.target.closest('.sc-edit');
    if(eb){ openAddSellerModal(eb.dataset.r, parseInt(eb.dataset.i)); return; }
  };
}

// ─── COMMISSION ACCELERATOR ──────────────────────────────────────
// 5% up to target, 7% on anything above target
function calcCommission(actualTAC, targetTAC){
  if(actualTAC <= 0) return 0;
  if(actualTAC <= targetTAC) return Math.round(actualTAC * 0.05);
  var base = Math.round(targetTAC * 0.05);
  var accel = Math.round((actualTAC - targetTAC) * 0.07);
  return base + accel;
}
// Updated getSellerTarget to use accelerator messaging
function getCommissionLabel(t){
  if(!t || t.tt <= 0) return '';
  var base = Math.round(t.tt * 0.05);
  return '₹'+fmtN(base)+' (5% of ₹'+fmtN(t.tt)+') + 7% on any TAC above target';
}

// ─── VACANCY IMPACT ───────────────────────────────────────────────
function getVacancyImpact(monthIdx){
  var MGRS = {Nordic:'Gaurav Malani',Europe:'Gaurav Malani',Bali:'Sayandeep',Singapore:'Sayandeep',Kenya:'Sayandeep'};
  var vacancies = [];
  var totalLostTAC = 0;
  regions.forEach(function(r){
    for(var i=0;i<r.sellers;i++){
      var sd = getSeller(r.name,i);
      if(!sd){
        var t = getSellerTarget(r.name, i, monthIdx);
        totalLostTAC += t.tt;
        vacancies.push({region:r.name, slot:i+1, manager:MGRS[r.name], lostTAC:t.tt, lostPNR:t.tp, priority: t.tt});
      }
    }
  });
  vacancies.sort(function(a,b){return b.priority-a.priority;});
  return {vacancies:vacancies, totalLostTAC:totalLostTAC};
}

  var regionBreakdown = {};
  allSellers.forEach(function(s){
    if(!regionBreakdown[s.region]) regionBreakdown[s.region]={manager:s.manager,tac:0,pnr:0,sellers:0};
    regionBreakdown[s.region].tac += s.t.tt;
    regionBreakdown[s.region].pnr += s.t.tp;
    regionBreakdown[s.region].sellers++;
  });
  var sortedRegions = Object.keys(regionBreakdown).sort(function(a,b){return regionBreakdown[b].tac-regionBreakdown[a].tac;});
  sortedRegions.forEach(function(rname){
    var rb = regionBreakdown[rname];
    var r = regions.find(function(x){return x.name===rname;})||{haul:'Long-Haul'};
    var arps = rb.sellers>0 ? Math.round(rb.tac/rb.sellers) : 0;
    var pct = totalTAC>0 ? Math.round(rb.tac/totalTAC*100) : 0;
    h += '<tr style="cursor:pointer" onmouseover="this.style.background=\'#F8FAFC\'" onmouseout="this.style.background=\'\'">'; 
    h += '<td style="font-weight:600">'+rname+'</td>';
    h += '<td style="font-size:11px;color:#64748B">'+rb.manager+'</td>';
    h += '<td>'+haulBadge(r.haul||'Long-Haul')+'</td>';
    h += '<td>'+rb.sellers+'</td>';
    h += '<td style="color:#0F6E56;font-weight:600">'+fmt(rb.tac)+'</td>';
    h += '<td>'+fmtN(rb.pnr)+'</td>';
    h += '<td style="color:#5C3D00">'+fmt(arps)+'</td>';
    h += '<td><div style="display:flex;align-items:center;gap:6px"><div style="width:60px;height:6px;background:#E2E8F0;border-radius:3px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:#0B7285;border-radius:3px"></div></div><span style="font-size:11px;color:#64748B">'+pct+'%</span></div></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  // Seller leaderboard (filtered)
  h += '<div class="sec">Seller leaderboard — '+MONTHS_LABELS[analyticsMonth]+' '+(analyticsManager!=='all'?'· '+analyticsManager:'')+(analyticsRegion!=='all'?'· '+analyticsRegion:'')+'</div>';
  var sorted = allSellers.slice().sort(function(a,b){return b.t.tt-a.t.tt;});
  h += '<div style="background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;margin-bottom:16px">';
  h += '<table class="mtbl" style="margin-bottom:0"><thead><tr><th>#</th><th>Seller</th><th>Region</th><th>Manager</th><th>Ramp</th><th>Leads/day</th><th>PNR target</th><th>TAC target</th><th>Commission</th><th>Total earnings</th></tr></thead><tbody>';
  sorted.forEach(function(s,idx){
    var med = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'';
    var rampBg = s.t.rf===1?'#DCFCE7':s.t.rf>0?'#FEF9C3':'#F1F5F9';
    var rampCl = s.t.rf===1?'#166534':s.t.rf>0?'#78350F':'#94A3B8';
    var commLabel = getCommissionLabel(s.t);
    h += '<tr style="cursor:pointer" onmouseover="this.style.background=\'#F8FAFC\'" onmouseout="this.style.background=\'\'">'; 
    h += '<td style="font-weight:700;color:#C9901A">'+med+(idx+1)+'</td>';
    h += '<td style="font-weight:600">'+(s.isNamed?s.name:'<span style="color:#94A3B8">Seller '+s.slot+'</span>')+'</td>';
    h += '<td style="font-size:11px">'+s.region+'</td>';
    h += '<td style="font-size:11px;color:#64748B">'+s.manager+'</td>';
    h += '<td><span style="font-size:10px;padding:2px 6px;border-radius:20px;background:'+rampBg+';color:'+rampCl+'">'+(s.t.notJoined?'Not joined':s.t.rf===1?'100%':Math.round(s.t.rf*100)+'%')+'</span></td>';
    h += '<td style="color:#0C447C">'+s.t.dLeads+'</td>';
    h += '<td style="color:#0F6E56;font-weight:600">'+s.t.tp+'</td>';
    h += '<td style="color:#0F6E56;font-weight:600">'+fmt(s.t.tt)+'</td>';
    h += '<td style="color:#854F0B" title="'+commLabel+'">₹'+fmtN(s.t.comm)+'</td>';
    h += '<td style="color:#0A1628;font-weight:600">₹'+fmtN(s.t.earn)+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  // Vacancy impact
  if(vacancyData.vacancies.length > 0){
    h += '<div class="sec">Vacancy impact — TAC being lost right now in '+MONTHS_LABELS[analyticsMonth]+'</div>';
    h += '<div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:14px 16px;margin-bottom:12px">';
    h += '<div style="font-size:13px;font-weight:600;color:#991B1B;margin-bottom:4px">⚠ '+vacancyData.vacancies.length+' unfilled slots are costing you '+fmt(vacancyData.totalLostTAC)+'/month in lost TAC</div>';
    h += '<div style="font-size:12px;color:#7F1D1D">Prioritise filling these slots — ranked by TAC impact:</div>';
    h += '</div>';
    h += '<div style="background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;margin-bottom:16px">';
    h += '<table class="mtbl" style="margin-bottom:0"><thead><tr><th>Priority</th><th>Slot</th><th>Region</th><th>Manager</th><th>Lost TAC/mo</th><th>Lost PNRs/mo</th><th>Action</th></tr></thead><tbody>';
    vacancyData.vacancies.slice(0,10).forEach(function(v,idx){
      h += '<tr>';
      h += '<td style="font-weight:700;color:#991B1B">'+(idx+1)+'</td>';
      h += '<td style="font-weight:600">'+v.region+' — Seller '+v.slot+'</td>';
      h += '<td>'+v.region+'</td>';
      h += '<td style="font-size:11px;color:#64748B">'+v.manager+'</td>';
      h += '<td style="color:#DC2626;font-weight:600">'+fmt(v.lostTAC)+'</td>';
      h += '<td style="color:#DC2626">'+v.lostPNR+'</td>';
      h += '<td><button class="sc-edit" data-r="'+v.region+'" data-i="'+(v.slot-1)+'" style="padding:3px 10px;border-radius:6px;border:1px solid #FECACA;background:#FEF2F2;cursor:pointer;font-size:11px;color:#DC2626">+ Add name</button></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  // Chatbot query section
  h += '<div class="sec">Smart query — ask anything about your plan</div>';
  h += '<div style="background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:16px;margin-bottom:16px">';
  h += '<div style="font-size:12px;color:#64748B;margin-bottom:10px">Type a question or click a quick query below:</div>';
  h += '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">';
  var quickQ = [
    "What is Gaurav's total TAC in "+MONTHS_LABELS[analyticsMonth]+"?",
    "Which seller has the highest target?",
    "How many PNRs does Bali need in "+MONTHS_LABELS[analyticsMonth]+"?",
    "What is the total commission pool this month?",
    "Which region contributes most to TAC?",
    "How many vacant slots do we have?"
  ];
  quickQ.forEach(function(q){
    h += '<button class="an-chip" data-q="'+q+'" style="padding:5px 12px;border:1px solid #E2E8F0;border-radius:20px;font-size:12px;background:#F8FAFC;cursor:pointer;color:#475569;font-family:-apple-system,sans-serif">'+q+'</button>';
  });
  h += '</div>';
  h += '<div style="display:flex;gap:8px">';
  h += '<input id="an-query-input" type="text" placeholder="e.g. Show me Sayandeep team targets in September 2026..." style="flex:1;padding:10px 14px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:13px;outline:none;font-family:-apple-system,sans-serif">';
  h += '<button id="an-query-btn" style="padding:10px 20px;border-radius:8px;border:none;background:#0A1628;color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:-apple-system,sans-serif">Ask</button>';
  h += '</div>';
  h += '<div id="an-query-result" style="margin-top:12px"></div>';
  h += '</div>';

  el.innerHTML = h;

  // Wire filter changes
  ['an-month','an-mgr','an-rgn'].forEach(function(id){
    var sel = el.querySelector('#'+id);
    if(sel) sel.onchange = function(){
      if(id==='an-month') analyticsMonth = parseInt(this.value);
      if(id==='an-mgr')   analyticsManager = this.value;
      if(id==='an-rgn')   analyticsRegion = this.value;
      renderAnalytics();
    };
  });

  // Wire event delegation — use onclick to prevent stacking on re-render
  el.onclick = function(e){
    // Reset filters
    if(e.target.dataset.anReset !== undefined){ analyticsMonth=selectedMonth; analyticsManager='all'; analyticsRegion='all'; renderAnalytics(); return; }
    // Quick query chips
    var chip = e.target.closest('.an-chip');
    if(chip){ document.getElementById('an-query-input').value=chip.dataset.q; runAnalyticsQuery(chip.dataset.q); return; }
    // Ask button
    if(e.target.id==='an-query-btn'){ var q=document.getElementById('an-query-input').value.trim(); if(q) runAnalyticsQuery(q); return; }
    // Enter key
    if(e.target.id==='an-query-input' && e.key==='Enter'){ var q2=e.target.value.trim(); if(q2) runAnalyticsQuery(q2); return; }
    // Edit vacancy slot
    var eb = e.target.closest('.sc-edit'); if(eb){ openAddSellerModal(eb.dataset.r,parseInt(eb.dataset.i)); return; }
  };
  var qi=el.querySelector('#an-query-input');
  if(qi) qi.onkeydown = function(e){ if(e.key==='Enter'){var q=this.value.trim();if(q)runAnalyticsQuery(q);} };
}

async function runAnalyticsQuery(query){
  var resultEl = document.getElementById('an-query-result');
  if(!resultEl) return;
  resultEl.innerHTML = '<div style="color:#64748B;font-size:13px">Thinking...</div>';

  // Build context for this query
  var context = buildPlanContext();
  var system = 'You are the Gantu Holidays Revenue Analyst. Answer the user query using ONLY the plan data provided. Be concise, specific, and use numbers. Format your answer clearly with the key number first.\n\n'+context;

  try{
    var resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,system:system,messages:[{role:'user',content:query}]})
    });
    var data = await resp.json();
    var answer = data.content && data.content[0] ? data.content[0].text : 'Could not process query.';
    resultEl.innerHTML = '<div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:12px 16px;font-size:13px;color:#1A2535;line-height:1.7">'+answer.replace(/\n/g,'<br>')+'</div>';
  }catch(e){
    resultEl.innerHTML = '<div style="color:#DC2626;font-size:12px">Query failed. Check your connection.</div>';
  }
}

<script>
var botOpen=false, botHistory=[];

function toggleBot(){
  botOpen=!botOpen;
  document.getElementById('bot-panel').classList.toggle('open',botOpen);
  if(botOpen&&!botHistory.length) showWelcome();
}

function showWelcome(){
  addBotMsg('assistant','Hi! I\'m your Gantu plan analyst. I know your full revenue plan — all 5 regions, seller counts, ramp model, TAC numbers, phase targets, and market data.\n\nAsk me anything. For example: *"How many leads does Europe need in September 2026?"* or *"Which month do we hit ₹50L net TAC?"*');
}

function buildPlanContext(){
  var lines=['=== GANTU HOLIDAYS REVENUE PLAN — LIVE DATA ===\n'];
  lines.push('Plan start date: May 2026');
  lines.push('Phase targets (monthly NET TAC run rate):');
  lines.push('  Phase 1: ₹50L/month — target by Month 6 (Oct 2026)');
  lines.push('  Phase 2: ₹75L/month — target by Month 8-10');
  lines.push('  Phase 3: ₹1Cr/month — target by Month 12-15\n');

  lines.push('RAMP MODEL:');
  lines.push('  Training: 3 weeks = Month 0 = 0% productivity');
  lines.push('  Month 1 on floor: 50% | Month 2: 75% | Month 3+: 100%');
  lines.push('  Age-based churn: Month 0-1: 15%/mo dropout | Month 2-3: 8%/mo | Month 4+: 2%/mo');
  lines.push('  Hiring: 2-3 sellers/month until target headcount. Replacements after 1-month gap.\n');

  lines.push('REGIONS:');
  regions.forEach(function(r){
    var fc=calcFull(r);
    var mo_names=['May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr'];
    lines.push('\n  Region: '+r.name+' ('+r.haul+')');
    lines.push('    Sellers: '+r.sellers+' | Working days: '+r.workdays);
    lines.push('    Leads/day/seller: '+r.leads+' | Conversion: '+r.conv+'%');
    lines.push('    Avg ticket (topline/PNR): ₹'+r.ticket.toLocaleString('en-IN'));
    lines.push('    Net TAC/PNR (bottomline): ₹'+r.tac.toLocaleString('en-IN'));
    lines.push('    FULL CAPACITY (all sellers 100% ramped):');
    lines.push('      Monthly leads: '+fmtN(fc.leads));
    lines.push('      Monthly PNRs: '+fmtN(fc.pnrs));
    lines.push('      Monthly topline: '+fmt(fc.topline));
    lines.push('      Monthly net TAC: '+fmt(fc.tac));
    lines.push('      ARPS: '+fmt(fc.arps)+'/seller/month');
    lines.push('      TAC margin: '+fc.margin+'%');
    lines.push('    MONTH-BY-MONTH (with ramp):');
    for(var m=0;m<12;m++){
      var mc=calcMonth(r,m);
      var mn=mo_names[m]+' 2026';
      lines.push('      '+mn+': leads='+fmtN(mc.leads)+', PNRs='+fmtN(mc.pnrs)+', topline='+fmt(mc.topline)+', TAC='+fmt(mc.tac)+', eff='+Math.round(mc.effFactor*100)+'%');
    }
    if(r.notes) lines.push('    Notes: '+r.notes);
  });

  lines.push('\nCOMBINED TOTALS (full capacity):');
  var tot={tl:0,tac:0,pnrs:0,leads:0,sel:0};
  regions.forEach(function(r){var c=calcFull(r);tot.tl+=c.topline;tot.tac+=c.tac;tot.pnrs+=c.pnrs;tot.leads+=c.leads;tot.sel+=r.sellers;});
  lines.push('  Total sellers: '+tot.sel+' across '+regions.length+' regions');
  lines.push('  Full cap monthly topline: '+fmt(tot.tl));
  lines.push('  Full cap monthly net TAC: '+fmt(tot.tac));
  lines.push('  Full cap monthly PNRs: '+fmtN(tot.pnrs));

  lines.push('\nCOMBINED MONTH-BY-MONTH (all regions, with ramp):');
  var mo_names2=['May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr'];
  var cross=getPhaseCrossings();
  for(var m=0;m<15;m++){
    var moTAC=regions.reduce(function(a,r){return a+calcMonth(r,m).tac;},0);
    var moTL=regions.reduce(function(a,r){return a+calcMonth(r,m).topline;},0);
    var moPNR=regions.reduce(function(a,r){return a+calcMonth(r,m).pnrs;},0);
    var moLeads=regions.reduce(function(a,r){return a+calcMonth(r,m).leads;},0);
    var phTag='';
    Object.keys(cross).forEach(function(pi){if(cross[pi]&&cross[pi].month===m)phTag+=' [PHASE '+(+pi+1)+' TARGET HIT]';});
    var yr=m<=7?2026:2027;
    var mn2=mo_names2[m]+' '+yr;
    lines.push('  '+mn2+': leads='+fmtN(moLeads)+', PNRs='+fmtN(moPNR)+', topline='+fmt(moTL)+', net_TAC='+fmt(moTAC)+phTag);
  }

  lines.push('\nFORMULAS (for reference):');
  lines.push('  Monthly leads = leads/day/seller × effective_sellers × working_days');
  lines.push('  Effective sellers = sellers × ramp_factor (derived from age-based churn model)');
  lines.push('  Monthly PNRs = monthly_leads × conversion_%');
  lines.push('  Topline = PNRs × avg_ticket_per_PNR');
  lines.push('  Net TAC = PNRs × net_tac_per_PNR');
  lines.push('  ARPS = net_TAC / effective_sellers');
  lines.push('  TAC margin = net_TAC / topline × 100');

  return lines.join('\n');
}

function addBotMsg(role,text){
  var msgs=document.getElementById('bot-msgs');
  var div=document.createElement('div');
  div.className='bot-msg '+role;
  div.innerHTML=text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
  if(role==='user') document.getElementById('bot-chips').style.display='none';
}

function addTyping(){
  var msgs=document.getElementById('bot-msgs');
  var div=document.createElement('div');
  div.className='bot-typing';div.id='bot-typing';
  div.innerHTML='<div class="bot-dot"></div><div class="bot-dot"></div><div class="bot-dot"></div>';
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
}
function removeTyping(){var t=document.getElementById('bot-typing');if(t)t.remove();}

function askChip(q){
  document.getElementById('bot-input').value=q;
  sendBot();
}

async function sendBot(){
  var inp=document.getElementById('bot-input');
  var q=inp.value.trim();if(!q)return;
  inp.value='';
  addBotMsg('user',q);
  botHistory.push({role:'user',content:q});
  addTyping();

  var systemPrompt='You are the Gantu Holidays Plan Analyst — an expert revenue analyst embedded inside the Gantu Holidays CRO dashboard. You have access to the complete, live revenue plan data below.\n\n'+
    'Your job: answer questions from the CRO (Amit) and his sales managers accurately, concisely, and helpfully. Always use the exact numbers from the plan data. Show your working when it helps. Be conversational but precise.\n\n'+
    'When answering about a specific month, calculate from the month-by-month data provided. When answering about leads, PNRs, TAC, or topline — always specify whether you mean full capacity or with ramp applied.\n\n'+
    'Keep answers concise — 3-6 lines unless the question needs more detail. Use ₹ for currency, Indian number formatting (L for lakhs, Cr for crore).\n\n'+
    buildPlanContext();

  var messages=botHistory.slice(-8);

  try{
    var resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:systemPrompt,
        messages:messages
      })
    });
    var data=await resp.json();
    removeTyping();
    if(data.error){
      addBotMsg('assistant','The AI assistant requires an Anthropic API key to work on hosted versions. All other dashboard features work fully without it.');
      return;
    }
    var text=data.content&&data.content[0]?data.content[0].text:'Sorry, I could not process that.';
    addBotMsg('assistant',text);
    botHistory.push({role:'assistant',content:text});
  }catch(e){
    removeTyping();
    addBotMsg('assistant','Connection error. Check your internet connection and try again.');
  }
}
</script>
